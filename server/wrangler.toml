name = "mapbox-3d-proxy"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787

# Set MAPBOX_SECRET_TOKEN with: wrangler secret put MAPBOX_SECRET_TOKEN
# ALLOWED_ORIGINS is a public var (CSV) and can be defined here:
[vars]
ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173"
RATE_LIMIT_PER_SECOND = "10"
